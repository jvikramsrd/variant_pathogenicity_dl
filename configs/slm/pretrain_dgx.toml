# Broad genomic continued pretraining on the DGX Spark.
#
# Order: vpdl-slm pretrain --config ... --dry-run     (builds everything, trains nothing)
#        vpdl-slm autotune --config ...               (measures micro_batch / compile HERE)
#        put autotune's "put_in_config" values below
#        vpdl-slm pretrain --config ...               (the real run, resumable)
#
# micro_batch below is a placeholder sized for a small card. The DGX Spark has
# ~128 GiB of unified memory: autotune will almost certainly raise it, and the
# log reports achieved TFLOPS against the 90.1 measured on this machine, so
# under-use shows up as a number.
# Status: NOT RUN - REQUIRES DGX SPARK.

[pretrain]
backbone = "hf:microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
corpus_dir = "data/slm_genomic/pretrain_corpus"
token_dir = "data/slm_genomic/pretrain_tokens"
out_dir = "runs/slm_genomic/pretrain"
objective = "auto"          # mlm for an encoder, clm for a decoder
context = 512
micro_batch = 32            # <- replace with `vpdl-slm autotune` output
grad_accum = 2              # <- autotune keeps tokens/step fixed while this changes
total_steps = 20000         # set from `vpdl-slm sizing` and the measured corpus size
lr = 5e-5
warmup_steps = 500
weight_decay = 0.01
mlm_probability = 0.15
eval_every = 250
checkpoint_every = 250
checkpoint_minutes = 30.0
keep_last = 3
log_every = 10
seed = 0
compile = false             # turn on once --benchmark shows it helps and the losses match

[pretrain.peft]
kind = "full"
allow_full = true           # continued pretraining trains the whole backbone on purpose
