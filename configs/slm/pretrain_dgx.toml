# Broad genomic continued pretraining on the DGX Spark.
# Run: vpdl-slm pretrain --config configs/slm/pretrain_dgx.toml
# First: --dry-run, then --benchmark 20 (both save nothing).
# Status: NOT RUN - REQUIRES DGX SPARK.

[pretrain]
backbone = "hf:microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
corpus_dir = "data/slm_genomic/pretrain_corpus"
token_dir = "data/slm_genomic/pretrain_tokens"
out_dir = "runs/slm_genomic/pretrain"
objective = "auto"          # mlm for an encoder, clm for a decoder
context = 512
micro_batch = 32
grad_accum = 2
total_steps = 20000         # set from `vpdl-slm sizing` and the measured corpus size
lr = 5e-5
warmup_steps = 500
weight_decay = 0.01
mlm_probability = 0.15
eval_every = 250
checkpoint_every = 250
checkpoint_minutes = 30.0
keep_last = 3
log_every = 10
seed = 0
compile = false             # turn on once --benchmark shows it helps and the losses match

[pretrain.peft]
kind = "full"
allow_full = true           # continued pretraining trains the whole backbone on purpose
